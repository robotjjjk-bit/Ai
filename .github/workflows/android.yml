name: Android CI (arm64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses + install platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build RikkaHub (base, arm64) + NexChat extras
        run: |
          ls
          if [ -f rikkahub/gradlew ]; then
            cd rikkahub && chmod +x ./gradlew && ./gradlew :app:assembleDebug --stacktrace
            find app/build/outputs/apk -type f | head -n 20
          else
            echo "submodule not fetched"
          fi
          cd ..
          if [ -f ./gradlew ]; then ./gradlew :app:assembleDebug --stacktrace; else echo "nexchat extras: web/ needs no build"; fi
          find . -path "*/outputs/apk/debug/*.apk" | head -n 20

      - name: Upload arm64 APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-debug
          path: |
            rikkahub/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
