name: Android CI (arm64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses + install platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle (cache only, use project wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json (secret or dummy)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            echo "$GS_JSON" | base64 -d > rikkahub/app/google-services.json
            echo "using real google-services.json from secret"
          else
            cat > rikkahub/app/google-services.json <<'JSON'
            {
              "project_info": {
                "project_number": "000000000000",
                "project_id": "dummy-project",
                "storage_bucket": "dummy-project.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                    "android_client_info": { "package_name": "me.rerere.rikkahub" }
                  },
                  "oauth_client": [],
                  "api_key": [{ "current_key": "dummy" }]
                },
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:000000000000:android:1111111111111111",
                    "android_client_info": { "package_name": "me.rerere.rikkahub.debug" }
                  },
                  "oauth_client": [],
                  "api_key": [{ "current_key": "dummy" }]
                }
              ],
              "configuration_version": "1"
            }
          JSON
            echo "using dummy google-services.json (Crashlytics no-op)"
          fi

      - name: Build RikkaHub debug (arm64 split + universal)
        run: |
          cd rikkahub
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug
          find app/build/outputs/apk -type f | head -n 20

      - name: Upload arm64 APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-debug
          path: rikkahub/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
